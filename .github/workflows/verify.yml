name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          IMAGE_PROVIDER: mock
          TELEMETRY_STORE: local
          BRAND_STYLE_ADMIN_TOKEN: ci-admin-token
