      function getScenarioAgentFromContent(content) {
        const trimmed = content.trim();

        return scenarioAgents.find((agent) => agent.enabled !== false && (
          trimmed === agent.trigger || trimmed.startsWith(`${agent.trigger} `)
        ));
      }

      function normalizeScenarioDraftPrompt(value) {
        return (value || "").replace(/\s+/g, " ").trim();
      }

      function clearScenarioAgentDraft() {
        scenarioAgentDraft = null;

        try {
          sessionStorage.removeItem(scenarioAgentDraftStorageKey);
        } catch {
          // Storage is best-effort; in-memory draft is enough for the current session.
        }
      }

      function saveScenarioAgentDraft(draft) {
        scenarioAgentDraft = draft;

        try {
          sessionStorage.setItem(scenarioAgentDraftStorageKey, JSON.stringify(draft));
        } catch {
          // Ignore storage failures; the in-memory draft still works until the plugin reloads.
        }
      }

      function getScenarioAgentDraftForContent(content) {
        const normalizedContent = normalizeScenarioDraftPrompt(content);

        if (scenarioAgentDraft && !getScenarioAgentFromContent(content)) {
          return scenarioAgentDraft;
        }

        if (scenarioAgentDraft && normalizeScenarioDraftPrompt(scenarioAgentDraft.promptMain) === normalizedContent) {
          return scenarioAgentDraft;
        }

        try {
          const stored = JSON.parse(sessionStorage.getItem(scenarioAgentDraftStorageKey) || "null");

          if (stored && normalizeScenarioDraftPrompt(stored.promptMain) === normalizedContent) {
            scenarioAgentDraft = stored;
            return stored;
          }
        } catch {
          try {
            sessionStorage.removeItem(scenarioAgentDraftStorageKey);
          } catch {
            // Ignore storage cleanup failures.
          }
        }

        return null;
      }

      function getPreferredAspectRatioForScenarioAgent(agent, prompt) {
        const text = `${agent?.trigger || ""}\n${agent?.name || ""}\n${prompt || ""}`;

        if (/单体舞台|4\s*:\s*3/.test(text)) {
          return "4:3";
        }

        if (/微缩世界|3\s*:\s*4/.test(text)) {
          return "3:4";
        }

        return "";
      }

      function buildDirectPromptFromScenarioDraft(content) {
        const draft = getScenarioAgentDraftForContent(content);

        if (!draft) {
          return undefined;
        }

        return {
          positive: [draft.promptFixedPositive, content].filter(Boolean).join("\n\n"),
          negative: draft.promptNegative || "",
          template: "flat_to_3d",
          referencePack: {
            inputAssetId: selectedAssets[0]?.id || "text-only",
            stylePresetId: "",
            styleAnchors: [],
          },
        };
      }

      function getSlashContext() {
        const cursor = messageInput.selectionStart || 0;
        const beforeCursor = messageInput.value.slice(0, cursor);
        const match = beforeCursor.match(/(^|\s)\/([^\s/]*)$/);

        if (!match) {
          return undefined;
        }

        const query = match[2];
        return {
          query,
          start: cursor - query.length - 1,
          end: cursor,
        };
      }

      function getMentionContext() {
        const cursor = messageInput.selectionStart || 0;
        const beforeCursor = messageInput.value.slice(0, cursor);
        const match = beforeCursor.match(/(^|\s)@([^\s@]*)$/);

        if (!match) {
          return undefined;
        }

        const query = match[2];
        return {
          query,
          start: cursor - query.length - 1,
          end: cursor,
        };
      }

      function hideScenarioPanel() {
        scenarioPanel.classList.remove("open");
        scenarioPanel.innerHTML = "";
        activeScenarioSuggestions = [];
      }

      function buildScenarioText(scenario) {
        return scenario.variablePrompt || scenario.content || "";
      }

      function insertScenarioAgentTrigger(agent) {
        const context = getSlashContext();
        const value = messageInput.value;
        const insertText = `${agent.trigger} `;
        clearStyleSelectionsForScenarioAgent();

        if (!context) {
          messageInput.value = value ? `${value}\n${insertText}` : insertText;
          messageInput.focus();
          messageInput.selectionStart = messageInput.selectionEnd = messageInput.value.length;
          hideScenarioPanel();
          resizeMessageInput();
          selectionStatus.textContent = "已选择场景智能体，请继续输入主题后点击“生成Prompt”。";
          updateRunState();
          return;
        }

        const prefix = value.slice(0, context.start);
        const suffix = value.slice(context.end);
        const needsSpace = suffix && !/^\s/.test(suffix) ? " " : "";
        messageInput.value = `${prefix}${insertText}${needsSpace}${suffix}`;
        const cursor = prefix.length + insertText.length;
        messageInput.focus();
        messageInput.selectionStart = messageInput.selectionEnd = cursor;
        hideScenarioPanel();
        resizeMessageInput();
        selectionStatus.textContent = "已选择场景智能体，请继续输入主题后点击“生成Prompt”。";
        updateRunState();
      }

      function insertScenarioContent(scenario) {
        const context = getMentionContext();
        const value = messageInput.value;
        const insertText = buildScenarioText(scenario);
        selectedOperationScenarioId = scenario.id || "";

        if (!context) {
          messageInput.value = value ? `${value}\n${insertText}` : insertText;
          messageInput.focus();
          messageInput.selectionStart = messageInput.selectionEnd = messageInput.value.length;
          hideScenarioPanel();
          resizeMessageInput();
          updateRunState();
          return;
        }

        const prefix = value.slice(0, context.start);
        const suffix = value.slice(context.end);
        const needsSpace = suffix && !/^\s/.test(suffix) ? " " : "";
        messageInput.value = `${prefix}${insertText}${needsSpace}${suffix}`;
        const cursor = prefix.length + insertText.length + needsSpace.length;
        messageInput.focus();
        messageInput.selectionStart = messageInput.selectionEnd = cursor;
        hideScenarioPanel();
        resizeMessageInput();
        updateRunState();
      }

      function insertActiveScenarioSuggestion(suggestion) {
        if (suggestion.type === "scenario-agent") {
          insertScenarioAgentTrigger(suggestion.agent);
          return;
        }

        insertScenarioContent(suggestion.scenario);
      }

      function renderScenarioSuggestions() {
        const slashContext = getSlashContext();
        if (slashContext) {
          const query = slashContext.query.trim().toLowerCase();
          activeScenarioSuggestions = scenarioAgents
            .filter((agent) => agent.enabled !== false)
            .filter((agent) => !query || agent.name.toLowerCase().includes(query) || agent.trigger.toLowerCase().includes(query))
            .slice(0, 8)
            .map((agent) => ({ type: "scenario-agent", agent }));

          scenarioPanel.innerHTML = "";

          if (!activeScenarioSuggestions.length) {
            hideScenarioPanel();
            return;
          }

          for (const [index, suggestion] of activeScenarioSuggestions.entries()) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `scenario-option${index === 0 ? " active" : ""}`;
            button.innerHTML = `<strong></strong><span></span>`;
            button.querySelector("strong").textContent = suggestion.agent.trigger;
            button.querySelector("span").textContent = suggestion.agent.description;
            button.addEventListener("click", () => insertActiveScenarioSuggestion(suggestion));
            scenarioPanel.appendChild(button);
          }

          scenarioPanel.classList.add("open");
          return;
        }

        const context = getMentionContext();

        if (!context) {
          hideScenarioPanel();
          return;
        }

        const query = context.query.trim().toLowerCase();
        activeScenarioSuggestions = operationScenarios
          .filter((scenario) => !query || scenario.name.toLowerCase().includes(query))
          .slice(0, 8)
          .map((scenario) => ({ type: "operation-scenario", scenario }));

        scenarioPanel.innerHTML = "";

        if (!activeScenarioSuggestions.length) {
          hideScenarioPanel();
          return;
        }

        for (const [index, suggestion] of activeScenarioSuggestions.entries()) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `scenario-option${index === 0 ? " active" : ""}`;
          button.innerHTML = `<strong></strong><span></span>`;
          button.querySelector("strong").textContent = `@${suggestion.scenario.name}`;
          button.querySelector("span").textContent = suggestion.scenario.description || buildScenarioText(suggestion.scenario).slice(0, 36);
          button.addEventListener("click", () => insertActiveScenarioSuggestion(suggestion));
          scenarioPanel.appendChild(button);
        }

        scenarioPanel.classList.add("open");
      }

      function appendDebugSection(parent, title, content) {
        const section = document.createElement("section");
        const heading = document.createElement("strong");

      function buildReferenceDebugText(task) {
        const references = task.referenceAssets?.length ? task.referenceAssets : task.inputAsset ? [task.inputAsset] : [];

        if (!references.length) {
          return "无参考图";
        }

        return references.map((asset, index) => {
          const label = asset.referenceLabel || `图${index + 1}`;
          const size = asset.width && asset.height ? ` · ${asset.width}x${asset.height}` : "";
          return `${label}：${asset.filename || asset.name || asset.id}${size}`;
        }).join("\n");
      }

      function getHighestReferencedImageIndex(content) {
        const matches = [...content.matchAll(/图\s*(\d+)/g)];

        return matches.reduce((max, match) => Math.max(max, Number(match[1]) || 0), 0);
      }

      async function loadConfig() {
        if (isLoadingConfig) {
          return;
        }

        isLoadingConfig = true;
        trackEvent("config_load_start");
        const selectedModelId = modelSelect.value;
        const selectedAgentId = agentSelect.value;
        const selectedMaterialIds = [...materialPresetIds];
        const selectedColorPaletteId = colorPaletteSelect.value;
        const selectedShapeArchitectureId = shapeArchitectureSelect.value;

        try {
          const [modelsResponse, agentsResponse, materialsResponse, colorPalettesResponse, shapeArchitecturesResponse, scenariosResponse, scenarioAgentsResponse] = await Promise.all([
            apiFetch("/api/config/models"),
            apiFetch("/api/config/style-skills"),
            apiFetch("/api/config/materials"),
            apiFetch("/api/config/color-palettes"),
            apiFetch("/api/config/shape-architectures"),
            apiFetch("/api/config/operation-scenarios"),
            apiFetch("/api/config/scenario-agents"),
          ]);
          const failedResponse = [
            modelsResponse,
            agentsResponse,
            materialsResponse,
            colorPalettesResponse,
            shapeArchitecturesResponse,
            scenariosResponse,
            scenarioAgentsResponse,
          ].find((response) => !response.ok);

          if (failedResponse) {
            const errorData = await failedResponse.json().catch(() => ({}));
            throw createApiError(failedResponse, errorData, "加载配置失败。");
          }

          const modelsData = await modelsResponse.json();
          const agentsData = await agentsResponse.json();
          const materialsData = await materialsResponse.json();
          const colorPalettesData = await colorPalettesResponse.json();
          const shapeArchitecturesData = await shapeArchitecturesResponse.json();
          const scenariosData = await scenariosResponse.json();
          const scenarioAgentsData = await scenarioAgentsResponse.json();

          modelSelect.innerHTML = "";
          agentSelect.innerHTML = "";
          colorPaletteSelect.innerHTML = "";
          shapeArchitectureSelect.innerHTML = "";

          for (const model of modelsData.models.filter((item) => item.enabled && (item.purpose || "image") === "image")) {
            const option = document.createElement("option");
            option.value = model.id;
            option.textContent = model.name;
            modelSelect.appendChild(option);
          }

          const emptyAgentOption = document.createElement("option");
          emptyAgentOption.value = "";
          emptyAgentOption.textContent = "未选择品牌预设";
          agentSelect.appendChild(emptyAgentOption);

          for (const agent of (agentsData.styleSkills || agentsData.agents || []).filter((item) => item.enabled)) {
            const option = document.createElement("option");
            option.value = agent.id;
            option.textContent = agent.name;
            agentSelect.appendChild(option);
          }

          materials = (materialsData.materials || []).filter((item) => item.enabled);
          colorPalettes = (colorPalettesData.colorPalettes || []).filter((item) => item.enabled);
          operationScenarios = (scenariosData.operationScenarios || []).filter((item) => item.enabled);
          scenarioAgents = (scenarioAgentsData.scenarioAgents || defaultScenarioAgents).filter((item) => item.enabled !== false);

          const emptyPaletteOption = document.createElement("option");
          emptyPaletteOption.value = "";
          emptyPaletteOption.textContent = "未选择配色";
          colorPaletteSelect.appendChild(emptyPaletteOption);

          for (const palette of colorPalettes) {
            const option = document.createElement("option");
            option.value = palette.id;
            option.textContent = palette.name;
            colorPaletteSelect.appendChild(option);
          }

          const emptyShapeArchitectureOption = document.createElement("option");
          emptyShapeArchitectureOption.value = "";
          emptyShapeArchitectureOption.textContent = "未选择形状";
          shapeArchitectureSelect.appendChild(emptyShapeArchitectureOption);

          for (const architecture of (shapeArchitecturesData.shapeArchitectures || []).filter((item) => item.enabled)) {
            const option = document.createElement("option");
            option.value = architecture.id;
            option.textContent = architecture.name;
            shapeArchitectureSelect.appendChild(option);
          }

          const modelOptions = [...modelSelect.options];
          if (selectedModelId && modelOptions.some((option) => option.value === selectedModelId)) {
            modelSelect.value = selectedModelId;
          } else if (modelOptions.some((option) => option.value === defaultModelId)) {
            modelSelect.value = defaultModelId;
          }

          if (selectedAgentId && [...agentSelect.options].some((option) => option.value === selectedAgentId)) {
            agentSelect.value = selectedAgentId;
          }

          materialPresetIds = selectedMaterialIds.filter((id) => materials.some((material) => material.id === id));

          if (selectedColorPaletteId && [...colorPaletteSelect.options].some((option) => option.value === selectedColorPaletteId)) {
            colorPaletteSelect.value = selectedColorPaletteId;
          }

          if (selectedShapeArchitectureId && [...shapeArchitectureSelect.options].some((option) => option.value === selectedShapeArchitectureId)) {
            shapeArchitectureSelect.value = selectedShapeArchitectureId;
          }

          colorPaletteId = colorPaletteSelect.value;
          shapeArchitectureId = shapeArchitectureSelect.value;
          renderPaletteInlineEditor();
          renderMaterialPanel();
          updateRunState();
          trackEvent("config_load_success", {
            modelCount: modelSelect.options.length,
            styleCount: agentSelect.options.length,
            materialCount: materials.length,
          });
        } catch (error) {
          trackEvent("config_load_fail", { issueId: ensureIssueId(error), requestId: error?.requestId });
          throw error;
        } finally {
          isLoadingConfig = false;
        }
      }

      async function ensureConversation(snapshot) {
        if (activeConversationId) {
          return activeConversationId;
        }

        if (!activeConversationPromise) {
          activeConversationPromise = (async () => {
            const response = await apiFetch("/api/conversations", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                modelId: snapshot.modelId,
                agentId: snapshot.agentId,
              }),
            });
            const data = await response.json();
            if (!response.ok || !data.conversation) {
              throw createApiError(response, data, "创建对话失败");
            }
            activeConversationId = data.conversation.id;
            return activeConversationId;
          })();
        }

        const pendingConversation = activeConversationPromise;
        try {
          return await pendingConversation;
        } finally {
          if (activeConversationPromise === pendingConversation) {
            activeConversationPromise = null;
          }
        }
      }

      async function submitConversationMessage(snapshot, hasRetried = false, signal) {
        const conversationId = await ensureConversation(snapshot);
        const response = await apiFetch(`/api/conversations/${conversationId}/messages`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            ...snapshot,
            operationScenarioId: snapshot.operationScenarioId || undefined,
          }),
          signal,
        });
        const data = await response.json();

        if ((response.status === 404 || data.error === "Conversation not found.") && !hasRetried) {
          if (activeConversationId === conversationId) {
            activeConversationId = null;
          }
          return submitConversationMessage(snapshot, true, signal);
        }

        if (!response.ok) {
          if (data.quota && memberSession) {
            memberSession = {
              ...memberSession,
              ...data.quota,
            };
            renderMemberSession();
          }
          throw createApiError(response, data, "生成失败");
        }

        refreshMemberSession().catch(() => {});
        return data;
      }

      async function completeScenarioAgentPrompt(content, messageAttachments, signal) {
        const response = await apiFetch("/api/scenario-agent/complete", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            content,
            selectionAssets: messageAttachments,
          }),
          signal,
        });
        const data = await response.json();

        if (!response.ok) {
          throw createApiError(response, data, "场景智能体生成 Prompt 失败");
        }

        return data;
      }

      function isAbortError(error) {
        return error?.name === "AbortError";
      }

      function stopGeneration() {
        if (activeGenerationController) {
          trackEvent("generation_abort_requested");
          activeGenerationController.abort();
        }
      }

      function getParallelGenerationLimit() {
        const remainingToday = Number(memberSession?.remainingToday);
        return Number.isFinite(remainingToday)
          ? Math.min(maxParallelGenerations, Math.max(0, remainingToday))
          : maxParallelGenerations;
      }

      function resolveBatchSize() {
        batchSize = Math.min(4, Math.max(1, Number(batchSizeSelect.value) || 1));
        batchSizeSelect.value = String(batchSize);
        return batchSize;
      }

      function hasPromptOrchestrationConfig() {
        return Boolean(
          agentSelect.value
          || materialPresetIds.length
          || colorPaletteId
          || customPaletteColors.length
          || shapeArchitectureId
          || selectedOperationScenarioId
        );
      }

      function createGenerationSnapshot(content, messageAttachments, inputType, currentBatchSize) {
        const directPrompt = buildDirectPromptFromScenarioDraft(content);
        return {
          content,
          modelId: modelSelect.value,
          agentId: agentSelect.value,
          inputType,
          selectionAssets: messageAttachments,
          batchSize: currentBatchSize,
          aspectRatio: resolveAspectRatio(),
          resolution,
          materialPresetIds: [...materialPresetIds],
          colorPaletteId,
          customColorPalette: getCustomColorPalettePayload(),
          shapeArchitectureId,
          operationScenarioId: selectedOperationScenarioId,
          directPrompt,
          usePromptOrchestrator: directPrompt ? false : hasPromptOrchestrationConfig(),
        };
      }

      function addGenerationPending(loadingText, generationId, generationController) {
        const pending = addMessage("system", `${loadingText} 已用 0 秒`);
        const status = pending.querySelector(".message-content");
        const actions = document.createElement("div");
        const pauseButton = document.createElement("button");
        actions.className = "diagnostic-actions";
        pauseButton.type = "button";
        pauseButton.textContent = "暂停任务";
        pauseButton.addEventListener("click", () => {
          pauseButton.disabled = true;
          pauseButton.textContent = "正在暂停";
          status.textContent = "正在停止本次生成并退回额度...";
          trackEvent("generation_abort_requested", { generationId });
          generationController.abort();
        });
        actions.appendChild(pauseButton);
        pending.appendChild(actions);
        return { pending, status };
      }

      async function sendMessage() {
        if (isSending) {
          stopGeneration();
          return;
        }
        const parallelGenerationLimit = getParallelGenerationLimit();
        if (activeGenerations.size >= parallelGenerationLimit) {
          addMessage("system", parallelGenerationLimit
            ? `当前已有 ${parallelGenerationLimit} 个任务正在生成，请等待任一任务完成后再发送。`
            : "今日生成额度已用完，请联系管理员。");
          return;
        }

        const content = messageInput.value.trim();

        if (!content && !selectedAssets.length) {
          return;
        }

        const hasConfig = Boolean(
          agentSelect.value
          || colorPaletteId
          || shapeArchitectureId
          || materialPresetIds.length
          || selectedOperationScenarioId
        );
        if (!content && selectedAssets.length && !hasConfig) {
          const hint = "请描述要怎么处理这张图，或选择一个风格/形状/配色/材质。";
          selectionStatus.textContent = hint;
          addMessage("system", hint);
          updateRunState();
          return;
        }

        const highestReferencedImageIndex = getHighestReferencedImageIndex(content);
        if (highestReferencedImageIndex > selectedAssets.length) {
          addMessage("system", `你提到了图${highestReferencedImageIndex}，但当前只添加了 ${selectedAssets.length} 张参考图。请先点击“添加选中图”把图${highestReferencedImageIndex}加进来。`);
          return;
        }

        const scenarioAgent = getScenarioAgentFromContent(content);
        const messageAttachments = getLabeledSelectedAssets();

        if (scenarioAgent) {
          const generationController = new AbortController();
          activeGenerationController = generationController;
          isSending = true;
          clearStyleSelectionsForScenarioAgent();
          updateRunState();
          const pending = addMessage("system", `正在调用「${scenarioAgent.name}」补全 Prompt...`);
          trackEvent("scenario_complete_start", {
            scenarioAgentId: scenarioAgent.id,
            selectionCount: messageAttachments.length,
          });

          try {
            const data = await completeScenarioAgentPrompt(content, messageAttachments, generationController.signal);
            messageInput.value = data.prompt;
            saveScenarioAgentDraft({
              scenarioAgentId: data.scenarioAgent?.agentId || scenarioAgent.id,
              promptMain: data.prompt,
              promptFixedPositive: data.promptFixedPositive || "",
              promptNegative: data.promptNegative || "",
            });
            const preferredAspectRatio = getPreferredAspectRatioForScenarioAgent(scenarioAgent, data.prompt);

            if (preferredAspectRatio) {
              aspectRatio = preferredAspectRatio;
              aspectRatioSelect.value = preferredAspectRatio;
            }
            resizeMessageInput();
            pending.textContent = data.promptNegative
              ? `「${scenarioAgent.name}」已生成 Prompt，已回填正向 Prompt，并会在生成时使用智能体负面提示词：${data.promptNegative}`
              : `「${scenarioAgent.name}」已生成 Prompt，已回填到输入框。你可以继续修改，确认后再点击生成。`;
            selectionStatus.textContent = "场景智能体已补全 Prompt；普通品牌预设和自由搭配已清空。";
            trackEvent("scenario_complete_success", {
              scenarioAgentId: scenarioAgent.id,
              requestId: data.requestId,
            });
          } catch (error) {
            if (isAbortError(error)) {
              pending.textContent = "已暂停场景智能体补全。";
            } else {
              pending.remove();
              addMessage("system", getReadableError(error));
            }
            trackEvent(isAbortError(error) ? "scenario_complete_abort" : "scenario_complete_fail", {
              scenarioAgentId: scenarioAgent.id,
              issueId: isAbortError(error) ? undefined : ensureIssueId(error),
              requestId: error?.requestId,
            });
          } finally {
            isSending = false;
            if (activeGenerationController === generationController) {
              activeGenerationController = null;
            }
            updateRunState();
          }
          return;
        }

        const currentBatchSize = resolveBatchSize();
        const loadingText = currentBatchSize > 1
          ? `正在并发渲染 ${currentBatchSize} 张候选图...`
          : "正在渲染一种‘甲方闭嘴’的高级感...";
        let renderTimer;
        const generationId = createTelemetryId("generation_");
        const generationController = new AbortController();
        activeGenerations.set(generationId, generationController);
        updateRunState();
        if (content || messageAttachments.length) {
          addMessage("user", content, messageAttachments);
        }
        messageInput.value = "";
        resizeMessageInput();
        updateRunState();
        const snapshot = createGenerationSnapshot(content, messageAttachments, "auto", currentBatchSize);
        let inputType;
        try {
          inputType = await inferInputType(messageAttachments, content);
        } catch (error) {
          activeGenerations.delete(generationId);
          updateRunState();
          addMessage("system", getReadableError(error));
          trackEvent("generation_fail", {
            generationId,
            issueId: ensureIssueId(error),
          });
          return;
        }
        snapshot.inputType = inputType;
        const { pending, status } = addGenerationPending(loadingText, generationId, generationController);
        const startedAt = Date.now();
        trackEvent("generation_start", {
          generationId,
          batchSize: currentBatchSize,
          inputType,
          selectionCount: messageAttachments.length,
          modelId: snapshot.modelId,
          agentId: snapshot.agentId,
        });

        renderTimer = window.setInterval(() => {
          const elapsedSeconds = Math.floor((Date.now() - startedAt) / 1000);
          status.textContent = `${loadingText} 已用 ${elapsedSeconds} 秒`;
        }, 1000);

        try {
          const data = await submitConversationMessage(snapshot, false, generationController.signal);
          pending.textContent = data.conversation.messages.at(-1).content;
          if (!activeConversationId || activeConversationId === data.conversation.id) {
            activeConversationId = data.conversation.id;
          }
          renderResults(data.task, pending);
          clearSelectionsAfterGeneration();
          trackEvent("generation_success", {
            generationId,
            durationMs: Date.now() - startedAt,
            resultCount: data.task?.results?.length || 0,
            conversationId: data.conversation.id,
          });
        } catch (error) {
          if (isAbortError(error)) {
            pending.textContent = "已暂停本次生成，本次额度已退回。";
          } else {
            pending.remove();
            addMessage("system", getReadableError(error));
          }
          trackEvent(isAbortError(error) ? "generation_abort" : "generation_fail", {
            generationId,
            durationMs: Date.now() - startedAt,
            issueId: isAbortError(error) ? undefined : ensureIssueId(error),
            requestId: error?.requestId,
          });
        } finally {
          window.clearInterval(renderTimer);
          if (selectedOperationScenarioId === snapshot.operationScenarioId) {
            selectedOperationScenarioId = "";
            renderScenarioSuggestions();
          }
          activeGenerations.delete(generationId);
          updateRunState();
        }
      }

      function syncCurrentSelection() {
        addSelectionButton.disabled = true;
        selectionStatus.textContent = "正在添加当前选中图...";
        trackEvent("selection_start");
        parent.postMessage({ pluginMessage: { type: "sync-selection" } }, "*");
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function setupResizeHandle() {
        let isResizing = false;
        let startX = 0;
        let startY = 0;
        let startWidth = 0;
        let startHeight = 0;

        function handleMove(event) {
          if (!isResizing) {
            return;
          }

          const width = clamp(startWidth + event.clientX - startX, fixedWindowWidth, 1200);
          const height = clamp(startHeight + event.clientY - startY, 520, 1100);
          expandedWindowSize = { width, height };
          postResize(width, height);
        }

        function stopResize() {
          isResizing = false;
          document.body.classList.remove("resizing");
          document.removeEventListener("mousemove", handleMove);
          document.removeEventListener("mouseup", stopResize);
        }

        resizeHandle.addEventListener("mousedown", (event) => {
          event.preventDefault();
          isResizing = true;
          document.body.classList.add("resizing");
          startX = event.clientX;
          startY = event.clientY;
          startWidth = window.innerWidth;
          startHeight = window.innerHeight;
          document.addEventListener("mousemove", handleMove);
          document.addEventListener("mouseup", stopResize);
        });

        resizeHandle.addEventListener("dblclick", () => {
          const shouldExpand = window.innerWidth < 680;
          expandedWindowSize = {
            width: shouldExpand ? 760 : fixedWindowWidth,
            height: shouldExpand ? 860 : fixedWindowHeight,
          };
          postResize(expandedWindowSize.width, expandedWindowSize.height);
        });
      }

      collapseButton.addEventListener("click", () => {
        if (isCollapsed) {
          isCollapsed = false;
          document.body.classList.remove("is-collapsed");
          collapseButton.title = "收起插件";
          collapseButton.setAttribute("aria-label", "收起插件");
          postResize(expandedWindowSize.width, expandedWindowSize.height);
          return;
        }

        expandedWindowSize = {
          width: clamp(window.innerWidth || fixedWindowWidth, fixedWindowWidth, 1200),
          height: clamp(window.innerHeight || fixedWindowHeight, 520, 1100),
        };
        isCollapsed = true;
        document.body.classList.add("is-collapsed");
        collapseButton.title = "展开插件";
        collapseButton.setAttribute("aria-label", "展开插件");
        postResize(72, 72);
      });

      document.querySelector("#new-chat-button").addEventListener("click", async () => {
        await loadConfig();
        const conversationIdToDelete = activeConversationId;
        activeConversationId = null;

        if (conversationIdToDelete) {
          apiFetch(`/api/conversations/${conversationIdToDelete}`, {
            method: "DELETE",
          }).catch(() => {
            // Retention cleanup will remove the conversation if immediate deletion fails.
          });
        }

        agentSelect.value = "";
        aspectRatioSelect.value = "auto";
        resolutionSelect.value = "2k";
        batchSizeSelect.value = "1";
        colorPaletteSelect.value = "";
        shapeArchitectureSelect.value = "";
        aspectRatio = "auto";
        resolution = "2k";
        batchSize = 1;
        selectedAssets = [];
        materialPresetIds = [];
        colorPaletteId = "";
        customPaletteColors = [];
        shapeArchitectureId = "";
        selectedOperationScenarioId = "";
        clearScenarioAgentDraft();
        messageInput.value = "";
        resizeMessageInput();
        selectionBar.textContent = "正在读取当前选区...";
        selectionStatus.textContent = "打开插件不会自动读取选区。";
        updateAspectRatioAutoLabel();
        closePalettePanel();
        renderPaletteInlineEditor({ resetColors: true });
        renderMaterialPanel();
        renderAttachments();
        chat.innerHTML = "";
        addMessage("system", "已清空当前面板。请选择画布对象并描述本轮需求。");
        updateRunState();
      });

      async function submitMemberLogin() {
        if (memberLoginButton.dataset.loading === "true") {
          return;
        }

        const code = memberInviteCodeInput.value.trim();

        if (!code) {
          memberLoginStatus.textContent = "请输入成员邀请码。";
          memberInviteCodeInput.focus();
          return;
        }

        memberLoginButton.dataset.loading = "true";
        memberLoginButton.disabled = true;
        memberLoginButton.textContent = "验证中...";
        memberLoginStatus.textContent = "";
        trackEvent("login_start");

        try {
          const response = await apiFetch("/api/member/session/redeem", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ code }),
            skipAuth: true,
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok || !data.sessionToken || !data.session) {
            throw createApiError(response, data, "邀请码验证失败。");
          }

          saveMemberSession(data.sessionToken, data.session);
          hideMemberLogin();
          isCollapsed = false;
          document.body.classList.remove("is-collapsed");
          collapseButton.title = "收起插件";
          collapseButton.setAttribute("aria-label", "收起插件");
          chat.innerHTML = "";
          addMessage("system", "登录成功。请选择画布对象并描述本轮需求。");
          trackEvent("login_success");

          try {
            await loadConfig();
          } catch (loadError) {
            addMessage("system", getReadableError(loadError));
          }

          updateRunState();
          scheduleInitialComposerActionsScroll();
        } catch (error) {
          trackEvent("login_fail", { issueId: ensureIssueId(error), requestId: error?.requestId });
          showMemberLogin(getReadableError(error));
          memberLoginStatus.textContent = getReadableError(error);
        } finally {
          memberLoginButton.dataset.loading = "";
          memberLoginButton.disabled = false;
          memberLoginButton.textContent = "验证并进入";
        }
      }

      memberLoginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        submitMemberLogin();
      });
      memberLoginButton.addEventListener("click", (event) => {
        event.preventDefault();
        submitMemberLogin();
      });
      memberInviteCodeInput.addEventListener("input", () => {
        memberLoginStatus.textContent = "";
      });
      diagnosticsButton.addEventListener("click", (event) => {
        downloadDiagnosticBundle(event.altKey || event.shiftKey);
      });
      loginCopyDiagnosticsButton.addEventListener("click", () => {
        const issueId = memberLoginStatus.textContent.match(/问题编号：([^，）]+)/)?.[1] || "";
        copyDiagnosticInfo(issueId);
      });
      loginExportDiagnosticsButton.addEventListener("click", () => downloadDiagnosticBundle(false));

      memberLogoutButton.addEventListener("click", async () => {
        memberLogoutButton.disabled = true;

        try {
          if (memberSessionToken) {
            await apiFetch("/api/member/session", {
              method: "DELETE",
            });
          }
        } finally {
          clearMemberSession();
          showMemberLogin("已退出当前成员账号。");
          memberLogoutButton.disabled = false;
        }
      });

      modelSelect.addEventListener("focus", loadConfig);
      agentSelect.addEventListener("focus", loadConfig);
      agentSelect.addEventListener("change", updateRunState);
      materialSelectButton.addEventListener("click", async () => {
        await loadConfig();
        cancelMaterialPanelAutoClose();
        closePalettePanel();
        materialPanel.classList.toggle("open");
      });
      materialSelectButton.addEventListener("mouseenter", openMaterialPanel);
      materialSelectButton.addEventListener("mouseleave", () => {
        if (materialPanel.classList.contains("open")) {
          scheduleMaterialPanelAutoClose();
        }
      });
      materialPanel.addEventListener("mouseenter", cancelMaterialPanelAutoClose);
      materialPanel.addEventListener("mouseleave", scheduleMaterialPanelAutoClose);
      colorPaletteSelect.addEventListener("focus", async () => {
        await loadConfig();
        openPalettePanel();
      });
      paletteSelectWrap.addEventListener("mouseenter", () => {
        cancelPalettePanelAutoClose();
        openPalettePanel();
      });
      paletteSelectWrap.addEventListener("mouseleave", () => {
        if (paletteInlineEditor.classList.contains("open")) {
          schedulePalettePanelAutoClose();
        }
      });
      aspectRatioSelect.addEventListener("change", () => {
        aspectRatio = aspectRatioSelect.value;
      });
      resolutionSelect.addEventListener("change", () => {
        resolution = resolutionSelect.value;
      });
      batchSizeSelect.addEventListener("change", () => {
        resolveBatchSize();
      });
      colorPaletteSelect.addEventListener("change", () => {
        colorPaletteId = colorPaletteSelect.value;
        customPaletteColors = [];
        renderPaletteInlineEditor({ resetColors: true });
        openPalettePanel();
        updateRunState();
      });
      pluginAddPaletteColorButton.addEventListener("click", () => {
        cancelPalettePanelAutoClose();
        addPluginPaletteColorRow();
      });
      paletteInlineEditor.addEventListener("mouseenter", cancelPalettePanelAutoClose);
      paletteInlineEditor.addEventListener("mouseleave", schedulePalettePanelAutoClose);
      document.addEventListener("pointermove", (event) => {
        if (!palettePanelDeletePointer) {
          return;
        }

        const deltaX = event.clientX - palettePanelDeletePointer.x;
        const deltaY = event.clientY - palettePanelDeletePointer.y;

        if ((deltaX * deltaX) + (deltaY * deltaY) < 16) {
          return;
        }

        palettePanelDeletePointer = null;
        const bounds = paletteInlineEditor.getBoundingClientRect();
        const isPointerInside = event.clientX >= bounds.left
          && event.clientX <= bounds.right
          && event.clientY >= bounds.top
          && event.clientY <= bounds.bottom;

        if (!isPointerInside && paletteInlineEditor.classList.contains("open")) {
          schedulePalettePanelAutoClose();
        }
      });
      shapeArchitectureSelect.addEventListener("focus", loadConfig);
      shapeArchitectureSelect.addEventListener("change", () => {
        shapeArchitectureId = shapeArchitectureSelect.value;
      });
      document.addEventListener("click", (event) => {
        if (!materialPanel.contains(event.target) && event.target !== materialSelectButton) {
          materialPanel.classList.remove("open");
        }

        if (!paletteInlineEditor.contains(event.target) && event.target !== colorPaletteSelect) {
          closePalettePanel();
        }

        if (!scenarioPanel.contains(event.target) && event.target !== messageInput) {
          hideScenarioPanel();
        }
      });
      addSelectionButton.addEventListener("click", syncCurrentSelection);
      sendButton.addEventListener("click", sendMessage);
      messageInput.addEventListener("input", () => {
        resizeMessageInput();
        updateRunState();
        renderScenarioSuggestions();
      });
      messageInput.addEventListener("keydown", (event) => {
        if ((event.key === "Enter" || event.key === "Tab") && scenarioPanel.classList.contains("open") && activeScenarioSuggestions[0]) {
          event.preventDefault();
          insertActiveScenarioSuggestion(activeScenarioSuggestions[0]);
          return;
        }

        if (event.key === "Escape" && scenarioPanel.classList.contains("open")) {
          event.preventDefault();
          hideScenarioPanel();
          return;
        }

        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
          sendMessage();
        }
      });
      messageInput.addEventListener("click", renderScenarioSuggestions);
      setupResizeHandle();
      resizeMessageInput();
      window.addEventListener("resize", scrollComposerActionsIntoView);
      window.addEventListener("load", scheduleInitialComposerActionsScroll);
      scheduleInitialComposerActionsScroll();

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;

        if (!message) {
          return;
        }

        if (message.type === "selection-synced") {
          const incomingAssets = message.payload.assets || [];
          selectedAssets = mergeSelectedAssets(message.payload.assets || []);
          updateAspectRatioAutoLabel();
          renderAttachments();
          selectionBar.textContent = selectedAssets.length
            ? `已添加 ${selectedAssets.length} 张参考图，按选择顺序标为图1、图2。可点击缩略图右上角删除。`
            : message.payload.message;
          selectionStatus.textContent = incomingAssets.length
            ? `已添加 ${selectedAssets.length} 张参考图，按选择顺序标为图1、图2。`
            : message.payload.message;
          addSelectionButton.disabled = false;
          updateRunState();
          trackEvent("selection_success", {
            incomingCount: incomingAssets.length,
            totalCount: selectedAssets.length,
          });
        }

        if (message.type === "selection-error") {
          selectionBar.textContent = message.message;
          selectionStatus.textContent = message.message;
          addSelectionButton.disabled = false;
          trackEvent("selection_fail", {
            issueId: message.issueId,
            errorMessage: message.message,
          });
        }

        if (message.type === "insert-result-finished") {
          const pending = pendingInsertButtons.get(message.requestId);

          if (pending) {
            pending.button.textContent = message.ok ? "已插入" : pending.originalText;
            pending.button.disabled = false;
            pendingInsertButtons.delete(message.requestId);

            if (message.ok) {
              trackEvent("result_insert_success", { requestId: message.requestId });
              window.setTimeout(() => {
                pending.button.textContent = pending.originalText;
              }, 1200);
            }
          }

          if (!message.ok) {
            trackEvent("result_insert_fail", {
              requestId: message.requestId,
              issueId: message.issueId,
            });
            const error = new Error(message.message || "插入 Figma 失败。");
            error.issueId = message.issueId;
            addMessage("system", getReadableError(error));
          }
        }

        if (message.type === "controller-diagnostic") {
          trackEvent(message.eventName, message.metadata || {});
          if (!message.ok && message.message) {
            const error = new Error(message.message);
            error.issueId = message.issueId;
            addMessage("system", getReadableError(error));
          }
        }
      };

      initializeMemberSession()
        .then(async (isAuthenticated) => {
          if (!isAuthenticated) {
            updateRunState();
            return;
          }

          await loadConfig();
          updateRunState();
          scheduleInitialComposerActionsScroll();
        })
        .catch((error) => {
          addMessage("system", getReadableError(error));
        });
    </script>
  </body>
</html>
