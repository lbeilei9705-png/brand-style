    <div id="model-modal" class="modal-backdrop">
      <form id="model-form" class="modal">
        <header class="modal-header">
          <h2 id="model-modal-title">新建模型</h2>
          <button class="secondary-button" data-close-modal type="button">关闭</button>
        </header>
        <section class="modal-body admin-form-grid">
          <input id="model-id" type="hidden" />
          <label class="admin-field">
            <span>显示名称</span>
            <input id="model-name" type="text" required />
          </label>
          <label class="admin-field">
            <span>Provider</span>
            <select id="model-provider">
              <option value="mock">mock</option>
              <option value="fintopia">fintopia</option>
            </select>
          </label>
          <label class="admin-field">
            <span>模型 ID</span>
            <input id="model-value" type="text" required />
          </label>
          <label class="admin-field">
            <span>Quality</span>
            <select id="model-quality">
              <option value="auto">auto</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select>
          </label>
          <label class="admin-field">
            <span>用途</span>
            <select id="model-purpose">
              <option value="image">生图模型</option>
              <option value="language">语言模型</option>
            </select>
          </label>
          <label class="admin-field">
            <span>接口风格</span>
            <select id="model-api-style">
              <option value="azure">Azure/OpenAI Deployment（拼 deployments 和 api-version）</option>
              <option value="openai">OpenAI 兼容（/v1/images/generations）</option>
              <option value="custom">自定义 Path</option>
            </select>
          </label>
          <label class="admin-field">
            <span>API Version（可留空）</span>
            <input id="model-api-version" type="text" placeholder="例如 2024-02-01；无则留空" />
          </label>
          <label class="admin-field full">
            <span>API URL</span>
            <input id="model-api-url" type="text" placeholder="例如 https://api.openai.com 或中转站 base URL" />
          </label>
          <label class="admin-field full">
            <span>自定义 API Path（仅 custom 或特殊中转站需要）</span>
            <input id="model-api-path" type="text" placeholder="/v1/images/generations，可用 {model} 作为模型占位" />
          </label>
          <label class="admin-field">
            <span>API Key</span>
            <input id="model-api-key" type="password" autocomplete="off" />
          </label>
          <label class="admin-field">
            <span>启用</span>
            <select id="model-enabled">
              <option value="true">启用</option>
              <option value="false">停用</option>
            </select>
          </label>
        </section>
        <footer class="modal-footer">
          <button class="secondary-button" data-close-modal type="button">取消</button>
          <button class="primary-button" type="submit">保存模型</button>
        </footer>
      </form>
    </div>

    <div id="agent-modal" class="modal-backdrop">
