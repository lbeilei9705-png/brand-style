        <section id="telemetry-page" class="resource-page">
          <header class="page-header">
            <div>
              <h2>使用记录 / 诊断</h2>
              <p class="muted">查看模型与 Skill 调用质量，定位错误并导出可共享的诊断包。</p>
            </div>
            <div class="toolbar">
              <button id="refresh-telemetry-button" class="secondary-button" type="button">刷新</button>
              <button id="export-diagnostics-button" class="primary-button" type="button">下载诊断包</button>
            </div>
          </header>

          <form id="telemetry-filter-form" class="admin-card telemetry-filters">
            <label class="admin-field">
              <span>时间范围</span>
              <select id="telemetry-range">
                <option value="1h">最近 1 小时</option>
                <option value="24h" selected>最近 24 小时</option>
                <option value="7d">最近 7 天</option>
                <option value="30d">最近 30 天</option>
                <option value="custom">自定义</option>
              </select>
            </label>
            <label class="admin-field telemetry-custom-time" hidden>
              <span>开始时间</span>
              <input id="telemetry-from" type="datetime-local" />
            </label>
            <label class="admin-field telemetry-custom-time" hidden>
              <span>结束时间</span>
              <input id="telemetry-to" type="datetime-local" />
            </label>
            <label class="admin-field">
              <span>Level</span>
              <select id="telemetry-level">
                <option value="">全部</option>
                <option value="info">Info</option>
                <option value="warn">Warn</option>
                <option value="error">Error</option>
              </select>
            </label>
            <label class="admin-field">
              <span>Source</span>
              <select id="telemetry-source">
                <option value="">全部</option>
              </select>
            </label>
            <button class="primary-button" type="submit">应用筛选</button>
          </form>

          <div id="telemetry-status" class="telemetry-status" role="status">选择筛选条件后查看使用记录。</div>
          <section class="telemetry-metrics" aria-label="使用指标">
            <article class="telemetry-metric"><span>使用量</span><strong id="telemetry-total">—</strong><small>当前筛选范围</small></article>
            <article class="telemetry-metric"><span>成功率</span><strong id="telemetry-success-rate">—</strong><small>成功事件占比</small></article>
            <article class="telemetry-metric"><span>P50 延迟</span><strong id="telemetry-p50">—</strong><small>中位响应时间</small></article>
            <article class="telemetry-metric"><span>P95 延迟</span><strong id="telemetry-p95">—</strong><small>长尾响应时间</small></article>
          </section>

          <section class="telemetry-breakdowns">
            <article class="admin-card telemetry-panel">
              <header><h3>错误类型</h3><span id="telemetry-error-count">0 个错误</span></header>
              <div id="telemetry-error-types" class="distribution-list"></div>
            </article>
            <article class="admin-card telemetry-panel">
              <header><h3>模型分布</h3><span>调用次数</span></header>
              <div id="telemetry-models" class="distribution-list"></div>
            </article>
            <article class="admin-card telemetry-panel">
              <header><h3>Skill 分布</h3><span>调用次数</span></header>
              <div id="telemetry-skills" class="distribution-list"></div>
            </article>
          </section>

          <section class="telemetry-section">
            <div class="telemetry-section-heading">
              <div><h3>最近事件</h3><p class="muted">点击事件可查看请求、错误与上下文详情。</p></div>
              <span id="telemetry-event-count" class="case-count">0 条</span>
            </div>
            <div class="admin-card">
              <table class="telemetry-table">
                <thead><tr><th>时间</th><th>Level</th><th>Source / 事件</th><th>模型 / Skill</th><th>耗时</th><th>操作</th></tr></thead>
                <tbody id="telemetry-events-table"></tbody>
              </table>
            </div>
          </section>

          <section class="telemetry-section">
            <div class="telemetry-section-heading">
              <div><h3>Issue 列表</h3><p class="muted">按错误类型聚合当前范围内的异常。</p></div>
              <span id="telemetry-issue-count" class="case-count">0 项</span>
            </div>
            <div id="telemetry-issues" class="telemetry-issue-list"></div>
          </section>
        </section>
      </section>
    </main>

    <div id="telemetry-detail-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="telemetry-detail-title">
      <section class="modal telemetry-detail-modal">
        <header class="modal-header">
          <div><h2 id="telemetry-detail-title">事件详情</h2><span id="telemetry-detail-subtitle" class="muted"></span></div>
          <button class="secondary-button" data-close-modal type="button">关闭</button>
        </header>
        <section class="modal-body">
          <dl id="telemetry-detail-summary" class="telemetry-detail-summary"></dl>
          <div>
            <h3>原始事件</h3>
            <pre id="telemetry-detail-json" class="telemetry-json"></pre>
          </div>
        </section>
      </section>
    </div>
